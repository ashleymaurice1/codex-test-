<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midnight Ghost Arcade — Submission materials</title><style>body{margin:0;background:#0d1727;color:#eee7da;font:16px/1.6 system-ui}main{max-width:960px;margin:auto;padding:30px 20px 60px}h1{line-height:1.15;color:#f4c57d}img{display:block;width:100%;height:auto;border-radius:16px;margin:20px 0}a,button{display:inline-block;background:#f4c57d;color:#122038;padding:12px 18px;border:0;border-radius:10px;text-decoration:none;font:inherit;margin:6px 8px 6px 0}textarea{box-sizing:border-box;width:100%;min-height:320px;background:#152338;color:#f0e9df;padding:18px;border:1px solid #66829b;border-radius:12px;font:inherit}p{max-width:800px}a.game{background:#b8d4ff}</style></head><body><main><h1>Midnight Ghost Arcade</h1><p>Your project link, cover image and description for Handshake.</p><a class="game" href="/">Open the game</a><a href="/assets/social/midnight-ghost-arcade-cover.png" download="Midnight-Ghost-Arcade-Cover.png">Download cover image</a><img src="/assets/social/midnight-ghost-arcade-cover.png" alt="Midnight Ghost Arcade cover with Mach, Slink, Ember and Misty beneath a full moon"><h2>Project URL</h2><p>https://codex-test-midnight-zombies.onrender.com</p><h2>Project description</h2><textarea id="description" readonly aria-label="Project description">Midnight Ghost Arcade is a magical Halloween arcade built with OpenAI. Choose Mach the ghost falcon, Slink the ghost serpent, Ember the ghost wolf, or Misty the tiny ghost bat, then explore four game styles: a candlelit Día de los Muertos-inspired jumping course, a six-song arrow-key rhythm game, a candy-collecting maze with spooky pursuers, and a live multiplayer tap race.

Play solo against rivals, challenge friends in a shared room, or take the 20-stop Journey across all four styles. Increasing difficulty, longer and endless jumping runs, personal high scores, earned coins and character accessories give players reasons to return. English and Spanish menus, phone touch controls, clear countdowns, gentle character expressions and an optional soundtrack playlist complete the midnight adventure. No account or installation is required to play.</textarea><button id="copy">Copy description</button><p id="copy-status" role="status"></p><script>document.getElementById('copy').onclick=async()=>{const field=document.getElementById('description');try{await navigator.clipboard.writeText(field.value);document.getElementById('copy-status').textContent='Description copied.'}catch{field.focus();field.select();document.getElementById('copy-status').textContent='Description selected. Choose Copy on your device.'}};</script></main></body></html>
