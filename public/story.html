<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08121f" />
    <title>Midnight Ghost Arcade · Story poster</title>
    <style>
      body {
        margin: 0;
        padding: 20px 16px;
        background: #08121f;
        color: #d0dbe5;
        font: 14px/1.6 system-ui;
        text-align: center;
      }
      main {
        max-width: 540px;
        margin: auto;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        margin: 18px auto;
        border-radius: 12px;
      }
      a {
        color: #a4d9ff;
      }
      .save {
        display: block;
        padding: 13px;
        border: 1px solid #efbd7a66;
        border-radius: 10px;
        background: #192738;
        color: #f4c88b;
        font-weight: 600;
        text-decoration: none;
      }
      p {
        margin: 14px auto;
      }
    </style>
  </head>
  <body>
    <main>
      <a
        class="save"
        href="/assets/social/midnight-ghost-arcade-simple-story.png"
        download="Midnight-Ghost-Arcade-Poster.png"
        >Save poster ↓</a
      >
      <img
        src="/assets/social/midnight-ghost-arcade-simple-story.png"
        alt="Midnight Ghost Arcade poster with Mach, Slink, Ember and Misty on a quiet moonlit background."
      />
      <p>On your phone, press and hold the picture to save it.</p>
      <p><a href="/">Open the game →</a></p>
    </main>
  </body>
</html>
